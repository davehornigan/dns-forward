name: release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
      - .dockerignore
      - Makefile
      - .air.toml
      - config.yaml.dist
      - config.schema.json
      - '.githooks/**'
      - '.agents/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.25'

jobs:
  # Detect whether the push changed anything other than test files. Test-only
  # pushes still run the quality gate but do not build an image or bump a tag.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect non-test changes
        id: detect
        run: |
          # Diff base is the LAST RELEASED tag's commit (not just the previous
          # push), so any unbuilt production change since the last release still
          # triggers a build — even when an intermediate build failed and the
          # follow-up fix only touched test/docs files.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          base="$(git rev-list -n 1 "$last_tag" 2>/dev/null || true)"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"   # no tag base → build to be safe
            exit 0
          fi
          echo "diffing against last release tag: $last_tag ($base)"
          files="$(git diff --name-only "$base" '${{ github.sha }}')"
          echo "changed files:"; echo "$files"
          # Files that never require a new image/tag: tests, docs, and local-dev
          # config. code_changed is true only if some OTHER (production) file
          # changed.
          nonbuild='(_test\.go$|\.md$|(^|/)Makefile$|(^|/)\.air\.toml$|(^|/)config\.yaml\.dist$|(^|/)config\.schema\.json$|(^|/)\.gitignore$|(^|/)\.dockerignore$|(^|/)LICENSE$|^\.githooks/|^\.agents/|^\.claude/)'
          if echo "$files" | grep -vE "$nonbuild" | grep -q .; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "test/docs/config-only push → no image build" ; echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Quality gate: nothing gets tagged or released unless the code is formatted,
  # vets clean, and the tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l internal main.go)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  tag:
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Skip tagging/release for test-only pushes (no image, no new tag).
    if: needs.changes.outputs.code_changed == 'true'
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.PAT }}
          tag_prefix: ""

  build_release:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.new_tag }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GOLANG_VERSION=${{ env.GO_VERSION }}
            APP_VERSION=${{ needs.tag.outputs.new_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          token: ${{ secrets.PAT }}

  cleanup_on_failure:
    runs-on: ubuntu-latest
    needs: [tag, build_release]
    if: failure() && needs.tag.result == 'success' && needs.tag.outputs.new_tag != ''
    steps:
      - name: Delete tag and release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = '${{ needs.tag.outputs.new_tag }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.data.id });
            } catch (err) {
              core.info(`Release delete skipped: ${err.message}`);
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (err) {
              core.info(`Tag delete skipped: ${err.message}`);
            }
